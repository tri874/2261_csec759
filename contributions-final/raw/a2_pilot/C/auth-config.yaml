# Assignment 2, matched control C (cookie version).
#
# Identical to webgoat-em.yaml except that both users also send the JWT
# lesson's own credential: an access_token cookie issued for lesson user Tom.
# scripts/a2_run_all.sh fetches a fresh token from WebGoat and writes the
# filled-in copy to environment/config/generated/webgoat-em-c-cookie.yaml.
auth:
  - name: userA
    fixedHeaders:
      - name: Cookie
        value: access_token=eyJhbGciOiJIUzUxMiJ9.eyJpYXQiOjE3OTE3NTM0MzUsImFkbWluIjoiZmFsc2UiLCJ1c2VyIjoiVG9tIn0.ib2UJC1LLQXaok6AOh4ewNmLBMuBnlLpJDWxdUCukF9wOxysktTnPDd6W9bJ7ENmkz1tTflWglDiUggK8nftig
    loginEndpointAuth:
      payloadUserPwd:
        username: useraa
        password: userAA
        usernameField: username
        passwordField: password
  - name: userB
    fixedHeaders:
      - name: Cookie
        value: access_token=eyJhbGciOiJIUzUxMiJ9.eyJpYXQiOjE3OTE3NTM0MzUsImFkbWluIjoiZmFsc2UiLCJ1c2VyIjoiVG9tIn0.ib2UJC1LLQXaok6AOh4ewNmLBMuBnlLpJDWxdUCukF9wOxysktTnPDd6W9bJ7ENmkz1tTflWglDiUggK8nftig
    loginEndpointAuth:
      payloadUserPwd:
        username: userbb
        password: userBB
        usernameField: username
        passwordField: password

authTemplate:
  loginEndpointAuth:
    endpoint: /WebGoat/login
    verb: POST
    contentType: application/x-www-form-urlencoded
    expectCookies: true
