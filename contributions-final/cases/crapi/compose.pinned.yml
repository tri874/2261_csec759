# Compose override used by scripts/final_crapi.sh: pins every crAPI image by
# digest. crAPI's release v1.1.6 (commit 700f03d, 2025-09-22) has no 1.1.6
# Docker tag except for crapi-identity; the images built from that commit are
# the "main" tags pushed on 2025-09-22, pinned here. postgres and mongo are
# the digests of postgres:14 and mongo:4.4 on 2026-11-12.
#
# Resource limits: crAPI caps MongoDB at 128 MB and 0.3 CPU. On our VM Mongo
# stayed at the memory cap, paged continuously and never passed its health
# check (2026-11-12; docker stats 122/128 MiB, health check timeouts), so the limits of the
# databases and the Java/Go/Python services are raised. Only the container
# limits change; the application code and data are crAPI's.
#
# Chatbot: not started (needs an OpenAI key; no /chatbot path is in the
# OpenAPI schema, so EvoMaster never calls it). crapi-web's nginx proxies
# /chatbot/ to CHATBOT_SERVICE and exits at startup when that host does not
# resolve, so CHATBOT_SERVICE points at mailhog's web port instead.
services:
  crapi-identity:
    image: crapi/crapi-identity@sha256:5d1db5b3ba8e02bc68711ec6fc4e35ed7cd8b87e63785ece9e7ff5b5e36c5260
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 768M
  crapi-community:
    image: crapi/crapi-community@sha256:8ba0c7eda86ae065a673f1fa554d0109a24f25c5a8d65097ae024e5ee715c54e
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
  crapi-workshop:
    image: crapi/crapi-workshop@sha256:d4d2d94d35a31e211b04d5a771881f5ae13e358e8fa0804463ae3bace05dd815
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
  crapi-web:
    image: crapi/crapi-web@sha256:b27d246c646bd33898e7d1d2095b6e7576c0993a7b81a73aa7386929493d7151
    environment:
      - CHATBOT_SERVICE=mailhog:8025
  api.mypremiumdealership.com:
    image: crapi/gateway-service@sha256:97dade9daf0e758547b1686e2d3303c8c9b79838167f728a9211f0ee1f4622b0
  mailhog:
    image: crapi/mailhog@sha256:015c23f79d40c9dc1800cd0a458503b89aeda3b585a12c37d53829d6c7d61fdd
  postgresdb:
    image: postgres@sha256:834a046089d76edd1d2e81c4741f3ad5d1853646ededc86c2708936aad31c1ed
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
  mongodb:
    image: mongo@sha256:4be76f674fc4b27859816811b8baa3c51830eb1dbf4ca81a51e26b79edd662ef
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
